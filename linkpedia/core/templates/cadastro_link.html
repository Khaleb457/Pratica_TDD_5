<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Link</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body data-bs-theme="dark">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Cadastrar Novo Link</h4>
                    </div>
                    
                    <div class="card-body">
                        <form method="POST" action="">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label for="{{ form.titulo.id_for_label }}" class="form-label">Título</label>
                                {{ form.titulo }}
                                {{ form.titulo.errors }}
                            </div>

                            <div class="mb-3">
                                <label for="{{ form.link.id_for_label }}" class="form-label">URL do Link</label>
                                {{ form.link }}
                                {{ form.link.errors }}
                            </div>

                            <div class="mb-3">
                                <label for="{{ form.observacao.id_for_label }}" class="form-label">Observação</label>
                                {{ form.observacao }}
                                {{ form.observacao.errors }}
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="/" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Salvar Link</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Importando o JS do Bootstrap (Opcional, mas recomendado para componentes dinâmicos) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
