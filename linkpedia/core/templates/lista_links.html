<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Links</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5" data-bs-theme="dark">
    <h2 class="mb-4">Seus Links Cadastrados</h2>
    
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Titulo</th>
                <th>Link</th>
                <th>Observações</th>
                <th>Ações</th> 
            </tr>
        </thead>
        <tbody>
            {% for l in links %}
            <tr>
                <td>{{ l.titulo }}</td>
                <td>{{ l.link }}</td>
                <td>{{ l.observacao }}</td>          
                <td>
                    <a href="" class="btn btn-sm btn-warning">Editar</a>
                    <a href="" 
                    class="btn btn-sm btn-danger" 
                    onclick="return confirm('Deseja realmente desativar este funcionário?')">Excluir</a>
                </td>
            </tr> 
            {% empty %}
            <tr>
                <td colspan="6" class="text-center">Nenhum Link Cadastrado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>    
    
    <a href="{% url 'cadastro' %}" class="btn btn-primary">Cadastrar Novo</a>
    <a href="{% url 'index' %}" class="btn btn-secondary">Voltar</a>
</body>
</html>
