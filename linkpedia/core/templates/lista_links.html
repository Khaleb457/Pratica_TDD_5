<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Links</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-dark text-light" data-bs-theme="dark">
    
    <div class="container mt-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4">    
            <h2 class="mb-0">
                <i class="bi bi-link-45deg text-primary"></i> Seus Links
            </h2>
            <div>
                <a href="{% url 'index' %}" class="btn btn-outline-secondary me-2">
                    <i class="bi bi-arrow-left"></i> Voltar
                </a>
                <a href="{% url 'cadastro' %}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Novo Link
                </a>
            </div>
        </div>
        
        <div class="card shadow-sm border-secondary">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-4">Título</th>
                                <th>Link</th>
                                <th>Observações</th>
                                <th class="text-center">Ações</th> 
                            </tr>
                        </thead>
                        <tbody>
                            {% for l in links %}
                            <tr class="align-middle">
                                <td class="ps-4 fw-bold text-capitalize">{{ l.titulo }}</td>
                                <td>
                                    <a href="{{ l.link }}" target="_blank" class="text-decoration-none text-info">
                                        {{ l.link }} <i class="bi bi-box-arrow-up-right ms-1" style="font-size: 0.75rem;"></i>
                                    </a>
                                </td>
                                <td class="text-secondary text-capitalize">{{ l.observacao|default:"-" }}</td>          
                                <td class="text-center">
                                    <a href="{% url 'editar' l.id %}" class="btn btn-sm btn-outline-warning me-1" title="Editar">
                                        <i class="bi bi-pencil-square"></i>
                                    </a>
                                    <a href="{% url 'deletar' l.id %}" class="btn btn-sm btn-outline-danger" title="Excluir" onclick="return confirm('Deseja realmente excluir este link?')">
                                        <i class="bi bi-trash3"></i>
                                    </a>
                                </td>
                            </tr> 
                            {% empty %}
                            <tr>
                                <td colspan="4" class="text-center py-5 text-muted">
                                    <i class="bi bi-folder2-open display-4 d-block mb-2"></i>
                                    Nenhum Link Cadastrado.
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table> 
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
