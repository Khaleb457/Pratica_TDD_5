<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edição de Link</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        .errorlist {
            color: #ea868f;
            list-style-type: none;
            padding-left: 0;
            font-size: 0.875em;
            margin-top: 0.25rem;
        }
        .errorlist li {
            display: flex;
            align-items: center;
        }
        .errorlist li::before {
            content: "\F33B";
            font-family: "bootstrap-icons";
            margin-right: 5px;
        }
    </style>
</head>
<body class="bg-dark text-light" data-bs-theme="dark">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="card shadow border-secondary">
                    <div class="card-header bg-success bg-gradient text-white d-flex align-items-center py-3">
                        <i class="bi bi-pencil-square fs-4 me-2"></i>
                        <h4 class="mb-0 text-capitalize">Editar: {{ links.titulo }}</h4>
                    </div>
                    
                    <div class="card-body p-4">
                        <form method="POST" action="">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label for="{{ form.titulo.id_for_label }}" class="form-label text-secondary">
                                    <i class="bi bi-fonts me-1"></i> Título
                                </label>
                                {{ form.titulo }}
                                {{ form.titulo.errors }}
                            </div>

                            <div class="mb-3">
                                <label for="{{ form.link.id_for_label }}" class="form-label text-secondary">
                                    <i class="bi bi-globe me-1"></i> URL do Link
                                </label>
                                {{ form.link }}
                                {{ form.link.errors }}
                            </div>

                            <div class="mb-4">
                                <label for="{{ form.observacao.id_for_label }}" class="form-label text-secondary">
                                    <i class="bi bi-journal-text me-1"></i> Observação
                                </label>
                                {{ form.observacao }}
                                {{ form.observacao.errors }}
                            </div>

                            <hr class="border-secondary">

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <a href="{% url 'listar' %}" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-circle me-1"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-success px-4">
                                    <i class="bi bi-check-circle me-1"></i> Salvar Alterações
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
